<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FactoryOS — Operator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="operator-shell">
  <div class="operator-card">
    <div>
      <div class="operator-greeting">Good Morning, Rahul</div>
      <div class="operator-job-label" style="margin-top:14px;">Current Job</div>
      <div class="operator-order">Order #1024</div>
      <div class="operator-product">Bottom Gusset Stand-up Pouch</div>
    </div>

    <div class="operator-stat-grid">
      <div class="operator-stat"><div class="l">Machine</div><div class="v">RG-02</div></div>
      <div class="operator-stat"><div class="l">Input Roll</div><div class="v">R-10245</div></div>
      <div class="operator-stat"><div class="l">Input Weight</div><div class="v">500 KG</div></div>
      <div class="operator-stat"><div class="l">Ink Used</div><div class="v">8.2 KG</div></div>
      <div class="operator-stat"><div class="l">Output</div><div class="v">492 KG</div></div>
      <div class="operator-stat"><div class="l">Waste</div><div class="v">8 KG</div></div>
    </div>

    <div class="operator-btn-grid">
      <button class="operator-btn start">START JOB</button>
      <button class="operator-btn pause">PAUSE</button>
      <button class="operator-btn issue">ADD ISSUE</button>
      <button class="operator-btn complete">COMPLETE JOB</button>
    </div>
  </div>
</div>
</body>
</html>
